```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Definition</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #fff1eb, #ace0f9);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            padding: 50px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1s ease;
        }

        h1 {
            color: #b71c1c;
            font-size: clamp(28px, 5vw, 46px);
            margin-bottom: 25px;
        }

        .definition {
            font-size: clamp(18px, 2.5vw, 25px);
            line-height: 1.7;
            color: #333;
            font-weight: 500;
            margin-bottom: 35px;
        }

        .java-button {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #e53935, #b71c1c);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: clamp(16px, 2vw, 20px);
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(183, 28, 28, 0.3);
            transition: all 0.3s ease;
        }

        .java-button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 25px rgba(183, 28, 28, 0.4);
        }

        .java-button:active {
            transform: scale(0.97);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 35px 20px;
                border-radius: 18px;
            }

            .definition {
                line-height: 1.6;
            }

            .java-button {
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>☕ Java</h1>

        <div class="definition">
            Java is a high-level, object-oriented, class-based programming
            language designed to be platform-independent and secure.
        </div>

        <a
            href="https://tinyurl.com/Javaimp026"
            target="_blank"
            rel="noopener noreferrer"
            class="java-button">
            🚀 Click Here to Continue
        </a>
    </div>

</body>
</html>
